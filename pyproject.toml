[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cloudmap"
version = "0.1.0"
description = "Read-only cloud discovery that draws your environment as an interactive architecture diagram."
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["boto3>=1.34"]

[project.optional-dependencies]
azure = ["azure-identity>=1.15", "azure-mgmt-resourcegraph>=8", "azure-mgmt-subscription>=3", "azure-mgmt-resource>=23", "azure-mgmt-keyvault>=10"]
gcp = ["google-cloud-asset>=3.26"]
all = ["cloudmap[azure,gcp]"]
dev = ["pytest", "moto[all]>=5", "playwright", "cloudmap[azure,gcp]"]

[project.scripts]
cloudmap = "cloudmap.cli:main"

[tool.setuptools.packages.find]
include = ["cloudmap*"]

[tool.setuptools.package-data]
"cloudmap.render" = ["template.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]
